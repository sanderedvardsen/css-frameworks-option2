<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Feed — Social (Option 2)</title>
  <link rel="stylesheet" href="../../dist/css/main.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <!-- relativ lenke tilbake til index (fra public/feed/) -->
    <a class="navbar-brand" href="index.html">Social</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="../profile/index.html">Profil</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container my-4">
  <div class="row">
    <aside class="col-12 col-md-4 mb-3">
      <div class="card p-3">
        <form id="searchForm" class="d-flex mb-3" role="search">
          <input id="searchInput" class="form-control me-2" type="search" placeholder="Søk i feed" aria-label="Søk">
          <button class="btn btn-outline-secondary" type="submit">Søk</button>
        </form>

        <label class="form-label">Sorter etter</label>
        <select id="sortSelect" class="form-select mb-3">
          <option value="nyeste">Nyeste</option>
          <option value="eldste">Eldste</option>
        </select>


        <h6>Lag nytt innlegg</h6>
        <form id="newPostForm" enctype="multipart/form-data">
          <div class="mb-2">
            <input type="text" class="form-control" name="title" placeholder="Tittel">
          </div>
          <div class="mb-2">
            <textarea class="form-control" name="text" placeholder="Hva skjer?" rows="3"></textarea>
          </div>

          <div class="mb-2">
            <label class="form-label small">Bilde (valgfritt)</label>
            <input class="form-control form-control-sm" type="file" name="image" accept="image/*">
            <div class="form-text small text-muted">Velg et bilde som blir brukt som thumbnail i feeden.</div>
          </div>

          <div class="d-grid">
            <button class="btn btn-primary" type="submit">Post</button>
          </div>
        </form>

      </div>
    </aside>

    <section class="col-12 col-md-8">
      <div class="list-group">
        <!-- innleggene legges til her via JS -->
      </div>
    </section>
  </div>
</main>

<script src="../../dist/js/bootstrap.bundle.min.js"></script>
<script src="../../src/js/main.js"></script>
</body>
</html>
